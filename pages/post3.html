    </div>

  <section class="hero" style="background-image: linear-gradient(rgba(18, 18, 18, 0.38), rgba(18, 18, 18, 0.58)), url('/featuredimages/3.jpg'); background-size: cover; background-position: center;">
    <h1 style="font-size: clamp(1.45rem, 1.3vw + 1.05rem, 2.2rem);">Train to Thoughts</h1>
  </section>

  <main class="post-article">
    <article>
      <div class="meta">Admin · Mar 21, 2023 · 3 min read</div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/posts/train-to-thoughts.md');
        const markdown = await response.text();
        document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
      } catch (error) {
        console.error('Error loading markdown:', error);
        document.getElementById('markdown-content').innerHTML = '<p>Error loading content.</p>';
      }
    });
  </script>
