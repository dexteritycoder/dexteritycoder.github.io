<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
    <link rel="stylesheet" href="/style.css">
    <title>About | Dexteritycoder</title>
</head>

<body>
    <button class="ham" onclick="ham()" aria-label="Open menu" type="button">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </button>
    <div class="navbar">
        <div id="leftnav">
            <a href="/index.html" style="text-decoration: none; color: inherit;">
                <h4>DEXTERITYCODER</h4>
            </a>
        </div>
        <div id="rightnav">
            <ul id="rightnavul">
                <a href="/index.html">
                    <li>HOME</li>
                </a>
                <a href="blog.html">
                    <li>WORKS</li>
                </a>
                <a href="/Blogs/blog-list.html">
                    <li>BLOGS</li>
                </a> <a href="donate.html"><li>DONATE</li></a> <a href="contact.html">
                    <li>CONTACT</li>
                </a>
                <a href="about.html">
                    <li>ABOUT</li>
                </a>
            </ul>
        </div>
    </div>

    <section class="hero">
        <h1 style="font-size: clamp(1.45rem, 1.3vw + 1.05rem, 2.2rem);"><b>STORIES</b> OF <b>CRAFT</b></h1>
    </section>

    <main class="post-article">
        <article>
            <section class="post-content" id="markdown-content">
                <p>Loading...</p>
            </section>
        </article>
        <a href="/Blogs/blog-list.html"><button class="call-to-blog-button">Explore Blogs</button></a>
    </main>

    <div class="gallery-container">
        <div class="gallery-title">GALLERY</div>
        <div class="gallery-viewport">
            <div class="gallery-slider">
                <div class="gallery-item">
                    <img src="/featuredimages/1.jpg" alt="Dexteritycoder image 3">
                </div>
                <div class="gallery-item">
                    <img src="/featuredimages/2.jpg" alt="Dexteritycoder image 4">
                </div>
                <div class="gallery-item">
                    <img src="/featuredimages/3.jpg" alt="Dexteritycoder image 5">
                </div>
                <div class="gallery-item">
                    <img src="/featuredimages/4.jpg" alt="Dexteritycoder image 6">
                </div>
            </div>
        </div>
        <button class="gallery-button left" onclick="slideLeft()" type="button" aria-label="Previous gallery items">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <button class="gallery-button right" onclick="slideRight()" type="button" aria-label="Next gallery items">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <section class="whole_footer">
        <footer>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><img src="/images/facebook.avif" alt=""></a>
                <a href="#" aria-label="Twitter"><img src="/images/twitter.avif" alt=""></a>
                <a href="#" aria-label="Pinterest"><img src="/images/pinterest.avif" alt=""></a>
                <a href="#" aria-label="Instagram"><img src="/images/instagram.avif" alt=""></a>
            </div>
            <hr class="footer_hr">
            <div class="newsletter">
                <h1>DEXTERITYCODER</h1>
                <form action="#">
                    <p>Enter your email here *</p>
                    <input type="email" required>
                    <div class="newsletter-check">
                        <input type="checkbox" id="subscribe">
                        <label for="subscribe">Yes, subscribe me to your newsletter.</label>
                    </div>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
            <hr class="footer_hr">
            <div class="copyright">
                <p>© 2026 Dexteritycoder</p>
            </div>
        </footer>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const response = await fetch('/posts/about.md');
      const markdown = await response.text();
      document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
    } catch (error) {
      console.error('Error loading markdown:', error);
      document.getElementById('markdown-content').innerHTML = '<p>Error loading content.</p>';
    }
  });
</script>

</html>
