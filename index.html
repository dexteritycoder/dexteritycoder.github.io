    <script>
      (function redirectSpaPath(location) {
        if (!location.search.startsWith("?/")) {
          var canonical = document.getElementById("canonical-url");
          if (canonical) {
            canonical.href = location.origin + location.pathname + location.search;
          }
          return;
        }

        const decoded = location.search
          .slice(2)
          .replace(/~and~/g, "&");
        const nextUrl = decoded + location.hash;
        window.history.replaceState(null, "", nextUrl);
        var canonical = document.getElementById("canonical-url");
        if (canonical) {
          canonical.href = location.origin + location.pathname + location.search;
        }
      })(window.location);
    </script>
    <script>
      (function initAdCompatibility(window, document) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function gtag() {
          window.dataLayer.push(arguments);
        };

        window.fbq = window.fbq || function fbq() {
          if (window.fbq.callMethod) {
            window.fbq.callMethod.apply(window.fbq, arguments);
            return;
          }
          window.fbq.queue = window.fbq.queue || [];
          window.fbq.queue.push(arguments);
        };
        window.fbq.queue = window.fbq.queue || [];
        window.fbq.loaded = window.fbq.loaded || false;
        window.fbq.version = window.fbq.version || "2.0";

        window.dexteritycoderAdConfig = window.dexteritycoderAdConfig || {
          consentMode: {
            ad_storage: "denied",
            analytics_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied",
          },
          slots: [],
        };

        window.gtag("consent", "default", window.dexteritycoderAdConfig.consentMode);
        window.fbq("consent", "revoke");

        document.documentElement.dataset.adServicesReady = "true";
      })(window, document);
    </script>
